[package]
name = "imperium-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Operator console — an in-process bus subscriber (one process, one runtime, one bus)"

[dependencies]
# The bus is Spiderweb-Bus-Next, vendored at `vendor/spiderweb-bus/`.
# There is no Imperium bus crate: subsystem crates depend on the kernel
# directly.
spiderweb = { workspace = true }
imperium-protocol = { path = "../imperium-protocol" }
imperium-net-signatures = { path = "../imperium-net-signatures" }
imperium-net-transport = { path = "../imperium-net-transport" }
eframe = "0.36"
tokio = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The supervision tests own the process composition: they register the real
# `spider` orchestrator and drive a real run loop.
spider = { workspace = true }
