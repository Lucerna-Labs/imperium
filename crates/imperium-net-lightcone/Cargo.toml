[package]
name = "imperium-net-lightcone"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Passive network Lightcone service: structural observation into the v4 causal world with sequenced receipts"

[dependencies]
imperium-protocol = { path = "../imperium-protocol" }
imperium-net-world = { path = "../imperium-net-world" }
imperium-net-observer = { path = "../imperium-net-observer" }
# The bus is Spiderweb-Bus-Next, vendored at `vendor/spiderweb-bus/`. There is
# no Imperium bus crate: this is a direct dependency on the kernel.
spiderweb = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The supervision tests own the process composition: they register the real
# `spider` orchestrator and drive a real run loop.
spider = { workspace = true }
