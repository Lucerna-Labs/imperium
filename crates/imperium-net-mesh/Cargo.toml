[package]
name = "imperium-net-mesh"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "P2P transport, NAT traversal, and peer connectivity"

[dependencies]
# The bus is Spiderweb-Bus-Next, vendored at `vendor/spiderweb-bus/`.
# There is no Imperium bus crate: subsystem crates depend on the kernel
# directly.
spiderweb = { workspace = true }
imperium-protocol = { path = "../imperium-protocol" }
imperium-net-crypto = { path = "../imperium-net-crypto" }
ed25519-dalek = { workspace = true }
ml-dsa = { workspace = true }
imperium-net-world = { path = "../imperium-net-world" }
imperium-net-observer = { path = "../imperium-net-observer" }
chacha20poly1305 = { workspace = true }
hkdf = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The supervision tests own the process composition: they register the real
# `spider` orchestrator and drive a real run loop.
spider = { workspace = true }
imperium-net-lightcone = { path = "../imperium-net-lightcone" }
imperium-net-sensors = { path = "../imperium-net-sensors" }
imperium-net-strainer = { path = "../imperium-net-strainer" }
