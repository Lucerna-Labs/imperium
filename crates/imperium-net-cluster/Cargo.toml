[package]
name = "imperium-net-cluster"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Operator-signed membership, bootstrap tokens, and configuration gossip"

[dependencies]
# The bus is Spiderweb-Bus-Next, vendored at `vendor/spiderweb-bus/`.
# There is no Imperium bus crate: subsystem crates depend on the kernel
# directly.
spiderweb = { workspace = true }
imperium-protocol = { path = "../imperium-protocol" }
imperium-net-crypto = { path = "../imperium-net-crypto" }
imperium-store = { path = "../imperium-store" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
parking_lot = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
# The supervision tests own the process composition: they register the real
# `spider` orchestrator and drive a real run loop.
spider = { workspace = true }
