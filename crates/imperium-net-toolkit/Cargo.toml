[package]
name = "imperium-net-toolkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Dormant forensics and counter-forensics tools"

[dependencies]
# The bus is Spiderweb-Bus-Next, vendored at `vendor/spiderweb-bus/`.
# There is no Imperium bus crate: subsystem crates depend on the kernel
# directly.
spiderweb = { workspace = true }
imperium-protocol = { path = "../imperium-protocol" }
imperium-managed-process = { path = "../imperium-managed-process" }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
# The supervision tests own the process composition: they register the real
# `spider` orchestrator and drive a real run loop.
spider = { workspace = true }
